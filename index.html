<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KAGOSHIMA WORLD | 실제 지형 탐험</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,sans-serif}body{background:#0b1721;color:white;overflow:hidden}#map{position:absolute;inset:0}.maplibregl-control-container{opacity:.8}.top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}.panel{background:rgba(9,22,33,.85);border:1px solid #ffffff30;backdrop-filter:blur(15px);border-radius:15px;padding:10px 12px;pointer-events:auto;box-shadow:0 6px 25px #0005}.brand{font-weight:800;font-size:15px}.small{font-size:11px;color:#c5d9e3;line-height:1.6}.weather{font-size:12px;text-align:right;max-width:170px}.bottom{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:10px;right:10px;background:rgba(9,22,33,.91);backdrop-filter:blur(18px);border:1px solid #ffffff30;border-radius:20px;padding:12px;max-width:650px;margin:auto;box-shadow:0 12px 35px #0009}h2{font-size:16px;margin:0 0 6px}.desc{font-size:12px;color:#b9cbd4;margin:0 0 10px}.buttons{display:flex;gap:7px;flex-wrap:wrap}button{background:#243d50;color:white;border:1px solid #ffffff2b;border-radius:11px;padding:11px 12px;font-size:12px;font-weight:700;cursor:pointer;flex:1;min-width:90px}button.primary{background:#19a99b}button:active{transform:scale(.98)}select{background:#243d50;color:white;border:1px solid #ffffff3b;border-radius:10px;padding:10px;width:100%;margin-bottom:9px;font-size:13px}.status{margin-top:8px;font-size:11px;color:#bcd4df}.flight{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(155deg,#173c60 0%,#5f9ebf 45%,#e8c19d 100%);z-index:10;flex-direction:column;text-align:center;padding:24px}.flight.show{display:flex}.plane{font-size:90px;filter:drop-shadow(0 12px 10px #0005);animation:float 2s ease-in-out infinite alternate}@keyframes float{from{transform:translate(-10px,12px) rotate(-8deg)}to{transform:translate(12px,-14px) rotate(7deg)}}.flight h1{font-size:24px;margin:15px 0 6px}.flight p{font-size:14px;line-height:1.8}.flight button{flex:none;width:200px;margin-top:12px}.notice{position:absolute;top:90px;left:12px;right:12px;pointer-events:none;text-align:center;font-size:11px;color:#e8f3f8;text-shadow:0 1px 6px #000}.maplibregl-popup-content{background:#132c3b;color:white;border-radius:12px;font:12px system-ui;padding:12px}.maplibregl-popup-close-button{color:white;font-size:20px}@media(min-width:700px){.top{padding:20px}.bottom{bottom:24px}.brand{font-size:18px}}
</style></head><body><div id="map"></div><div class="top"><div class="panel"><div class="brand">🌋 KAGOSHIMA WORLD</div><div class="small">실제 지형 · 3D 고도 · 자유 탐험</div></div><div class="panel weather"><div id="clock">일본 시간 확인 중</div><div id="weather">날씨 불러오는 중</div></div></div><div class="notice" id="notice">지도 손가락 드래그로 이동 · 두 손가락으로 회전/기울이기</div><div class="bottom"><h2 id="placeName">가고시마 실제 지형 탐험</h2><p class="desc" id="placeDesc">실제 지도와 고도 데이터로 산·해안·도시를 탐험해 봐.</p><select id="places"><option value="kagoshima">가고시마 시내 · 사쿠라지마</option><option value="shiroyama">시로야마 전망대</option><option value="tenmonkan">텐몬칸 · 렘 가고시마</option><option value="iso">이소 해변</option><option value="ferry">사쿠라지마 페리 터미널</option><option value="sakurajima">사쿠라지마 화산</option><option value="airport">가고시마공항</option><option value="incheon">인천국제공항</option></select><div class="buttons"><button class="primary" id="flightBtn">✈️ 비행 시작</button><button id="terrainBtn">⛰️ 3D 지형 ON</button><button id="inviteBtn">🔗 초대 링크</button><button id="followBtn">👥 함께 보기</button></div><div class="status" id="status">지도는 실제 지리 좌표 기반. 항공 이동은 연출이며 실시간 비행정보가 아님.</div></div><div class="flight" id="flight"><div class="plane">✈️</div><h1 id="flightTitle">인천국제공항 출발</h1><p id="flightText">활주로 진입 · 이륙 준비</p><button id="skip">건너뛰고 가고시마로</button></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const $=id=>document.getElementById(id);const P={kagoshima:{center:[130.605,31.595],zoom:11.2,pitch:67,bearing:-25,name:'가고시마 시내 · 사쿠라지마',desc:'실제 해안선과 화산 지형을 한눈에'},shiroyama:{center:[130.549,31.596],zoom:15.4,pitch:68,bearing:35,name:'시로야마 전망대',desc:'가고시마 시내와 사쿠라지마를 조망'},tenmonkan:{center:[130.554,31.589],zoom:16.3,pitch:60,bearing:20,name:'텐몬칸 · 렘 가고시마',desc:'가고시마 중심 번화가'},iso:{center:[130.58,31.615],zoom:15.2,pitch:65,bearing:-35,name:'이소 해변',desc:'사쿠라지마가 보이는 해안'},ferry:{center:[130.564,31.597],zoom:15,pitch:65,bearing:60,name:'사쿠라지마 페리 터미널',desc:'사쿠라지마로 건너가는 항구'},sakurajima:{center:[130.658,31.585],zoom:12.9,pitch:73,bearing:-35,name:'사쿠라지마',desc:'실제 화산 고도 데이터로 구현'},airport:{center:[130.719,31.803],zoom:14.5,pitch:60,bearing:25,name:'가고시마공항',desc:'가고시마 공항 도착'},incheon:{center:[126.451,37.46],zoom:13.8,pitch:58,bearing:20,name:'인천국제공항',desc:'여행의 출발점'}};
let map,terrain=true,conn=null,peer=null,host=false,room=null,syncTimer=null,applyingRemote=false;const qs=new URLSearchParams(location.search);room=qs.get('room');
const style={version:8,sources:{base:{type:'raster',tiles:['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png','https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors © CARTO'},dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:15,encoding:'terrarium',attribution:'Elevation tiles: Mapzen/AWS'}},layers:[{id:'base',type:'raster',source:'base'}],terrain:{source:'dem',exaggeration:1.5}};
map=new maplibregl.Map({container:'map',style,center:P.kagoshima.center,zoom:P.kagoshima.zoom,pitch:P.kagoshima.pitch,bearing:P.kagoshima.bearing,maxPitch:85,antialias:true});map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');map.on('error',e=>{console.warn('Map resource',e.error)});
Object.entries(P).forEach(([key,p])=>{if(key==='kagoshima')return;const el=document.createElement('div');el.style.cssText='background:#0c796f;border:2px solid white;border-radius:50%;width:13px;height:13px;box-shadow:0 2px 10px #0008';new maplibregl.Marker({element:el}).setLngLat(p.center).setPopup(new maplibregl.Popup({offset:15}).setHTML('<b>'+p.name+'</b><div>'+p.desc+'</div>')).addTo(map)});
function go(key,broadcast=true){const p=P[key];if(!p)return;map.flyTo({...p,duration:2400,essential:true});$('placeName').textContent=p.name;$('placeDesc').textContent=p.desc;$('places').value=key;if(broadcast)send({type:'place',key})}$('places').onchange=e=>go(e.target.value);$('terrainBtn').onclick=()=>{terrain=!terrain;map.setTerrain(terrain?{source:'dem',exaggeration:1.5}:null);$('terrainBtn').textContent=terrain?'⛰️ 3D 지형 ON':'🗺️ 3D 지형 OFF'};
function clock(){const t=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false,month:'short',day:'numeric'}).format(new Date());$('clock').textContent='🕒 가고시마 '+t}clock();setInterval(clock,30000);
async function weather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=31.596&longitude=130.557&current=temperature_2m,precipitation,cloud_cover,weather_code,wind_speed_10m&timezone=Asia%2FTokyo');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),w=d.current;const label=w.precipitation>0?'🌧️ 비':w.cloud_cover>75?'☁️ 흐림':w.cloud_cover>35?'⛅ 구름':'☀️ 맑음';$('weather').textContent=label+' '+Math.round(w.temperature_2m)+'°C · 바람 '+Math.round(w.wind_speed_10m)+'km/h';$('weather').title='Open-Meteo 모델 기반 현재 추정치, '+w.time;const hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',hourCycle:'h23'}).format(new Date()));if(hour<6||hour>=19)map.setPaintProperty('base','raster-brightness-max',.65);else map.setPaintProperty('base','raster-brightness-max',1)}catch(e){$('weather').textContent='날씨 연결 실패 · 다시 시도 중'}}weather();setInterval(weather,600000);
let flightTimers=[];function clearFlight(){flightTimers.forEach(clearTimeout);flightTimers=[];$('flight').classList.remove('show')}function startFlight(broadcast=true){clearFlight();if(broadcast)send({type:'flight'});$('flight').classList.add('show');$('flightTitle').textContent='인천국제공항 출발';$('flightText').textContent='활주로 진입 · 이륙 준비';map.jumpTo({...P.incheon});const steps=[[2800,'✈️ 이륙','인천 상공을 지나 일본으로 향하는 중'],[6500,'☁️ 구름 위 비행','인천 → 가고시마 · 항공 이동 연출'],[10500,'🌋 가고시마 접근','규슈 남부 상공 · 착륙 준비'],[14500,'🛬 가고시마공항 착륙','일본 가고시마에 도착했어'],[17500,'done','']];steps.forEach(([ms,title,desc])=>flightTimers.push(setTimeout(()=>{if(title==='done'){clearFlight();go('airport',false)}else{$('flightTitle').textContent=title;$('flightText').textContent=desc;if(ms===10500)map.jumpTo({...P.airport})}},ms)))}$('flightBtn').onclick=()=>startFlight();$('skip').onclick=()=>{clearFlight();go('airport')};
function send(data){if(conn&&conn.open)conn.send(data)}function receive(data){if(!data)return;if(data.type==='place')go(data.key,false);if(data.type==='flight')startFlight(false);if(data.type==='camera'&&!host){applyingRemote=true;map.easeTo({...data.camera,duration:400});setTimeout(()=>applyingRemote=false,500)}if(data.type==='hello'){$('status').textContent='🟢 상대방 접속 완료 · 함께 여행 중';send({type:'place',key:$('places').value})}}function attach(c){conn=c;c.on('open',()=>{$('status').textContent='🟢 2인 연결 완료';send({type:'hello'});});c.on('data',receive);c.on('close',()=>{$('status').textContent='연결 종료 · 새로고침 후 다시 연결해 줘'});c.on('error',()=>{$('status').textContent='연결 오류 · 네트워크 확인'})}
function startPeer(){if(typeof Peer==='undefined'){$('status').textContent='멀티플레이 라이브러리 로드 실패';return}const id=room?'kago-'+room+'-guest-'+Math.random().toString(36).slice(2,7):'kago-'+Math.random().toString(36).slice(2,11);host=!room;peer=new Peer(id);peer.on('open',()=>{if(host){room=id.replace('kago-','');$('status').textContent='방 생성됨 · 초대 링크를 복사해 줘'}else{attach(peer.connect('kago-'+room,{reliable:true}));$('status').textContent='상대방 연결 시도 중'}});peer.on('connection',c=>{if(host)attach(c)});peer.on('error',e=>{$('status').textContent='멀티플레이 연결 오류: '+e.type})}startPeer();
$('inviteBtn').onclick=async()=>{if(!room){$('status').textContent='방 생성 중 · 잠시 후 다시 눌러줘';return}const url=new URL(location.href);url.searchParams.set('room',room);try{await navigator.clipboard.writeText(url.href);$('status').textContent='초대 링크 복사 완료 · 카카오톡으로 보내줘'}catch(e){prompt('초대 링크를 복사해 줘',url.href)}};let follow=false;$('followBtn').onclick=()=>{follow=!follow;$('followBtn').textContent=follow?'👥 화면 동기화 ON':'👥 함께 보기';$('status').textContent=follow?'방장 시점이 상대방에게 전달돼':'시점 동기화 해제';};map.on('moveend',()=>{if(host&&follow&&!applyingRemote)send({type:'camera',camera:{center:map.getCenter().toArray(),zoom:map.getZoom(),pitch:map.getPitch(),bearing:map.getBearing()}})});
</script></body></html>
