<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>우리 둘의 가고시마 여행</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#fff;background:#9dc9dc}#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.top{position:fixed;top:0;left:0;right:0;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#15384eaa,transparent);pointer-events:none}.top strong{font-size:18px}.top small{display:block;opacity:.9;margin-top:4px}.top #status{font-size:12px;background:#102b3c99;padding:8px 12px;border-radius:99px}.panel{position:fixed;bottom:18px;left:18px;width:min(390px,calc(100vw - 36px));max-height:66vh;overflow:auto;background:#102b3ce8;backdrop-filter:blur(16px);padding:18px;border:1px solid #ffffff38;border-radius:22px;box-shadow:0 12px 50px #0004}.day{font-size:12px;color:#8fdfd4;font-weight:800;letter-spacing:2px}.panel h2{font-size:22px;margin:6px 0}.panel p{font-size:13px;color:#d7e7ef;margin:5px 0 14px}.progress{height:7px;border-radius:9px;background:#ffffff30;overflow:hidden;margin:12px 0}.progress>div{height:100%;width:0;background:#76e3ce;transition:width .3s}.buttons{display:flex;gap:7px;margin-top:9px}.buttons button{flex:1;min-width:0;background:#ffffff19;border:1px solid #ffffff3b;color:white;border-radius:11px;padding:11px 7px;font-weight:700;font-size:12px;cursor:pointer}.buttons button:first-child{background:#2a9d8f}.participants{font-size:12px;color:#a9e6d8;margin:13px 0 7px}.stops{display:flex;gap:6px;overflow-x:auto;padding:5px 0}.stop{flex-shrink:0;padding:6px 9px;border:1px solid #ffffff36;border-radius:99px;font-size:11px;opacity:.65}.stop.active{background:#e7c88b;color:#183447;opacity:1}.help{position:fixed;right:20px;bottom:20px;background:#102b3c77;padding:9px 13px;border-radius:30px;font-size:11px}.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:#12394a;padding:12px 20px;border-radius:12px;display:none}@media(max-width:700px){.top{padding:13px}.top strong{font-size:15px}.panel{bottom:10px;left:10px;width:calc(100vw - 20px);max-height:48vh;padding:14px}.panel h2{font-size:19px}.help{bottom:auto;top:73px;right:10px;font-size:10px}}
</style></head><body><div id="app"><canvas id="scene"></canvas><div class="top"><div><strong>🌋 우리 둘의 가고시마</strong><small>1박 2일 · 함께 떠나는 여행</small></div><span id="status">혼자 미리보기</span></div><div class="panel"><div class="day" id="day">DAY 1</div><h2 id="place">가고시마 공항</h2><p id="desc">우리의 여행이 시작되는 곳</p><div class="progress"><div id="bar"></div></div><div class="buttons"><button id="play">▶ 출발</button><button id="restart">↺ 처음부터</button><button id="speed">1× 속도</button></div><div class="buttons"><button id="invite">🔗 초대 링크 복사</button><button id="camera">📷 시점 전환</button></div><div class="participants" id="people">👫 두 사람이 함께하는 여행</div><div class="stops" id="stops"></div></div><div class="help">화면을 드래그해 풍경을 둘러보세요 · 핀치로 확대/축소</div><div class="toast" id="toast"></div></div><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script type="module">import * as THREE from 'https://esm.sh/three@0.170.0';
const stops=[['DAY 1','가고시마 공항','일본 남쪽 도시로 출발!',-36,-12],['DAY 1','가고시마 중앙역','도착 후 교통패스 준비',-26,-5],['DAY 1','시로야마 전망대','노을 속 사쿠라지마를 바라봐',-18,15],['DAY 1','흑돼지 돈카츠','가고시마의 특별한 저녁',-8,10],['DAY 1','렘 가고시마','잠시 짐을 내려놓는 시간',0,6],['DAY 1','잇포 이자카야','함께하는 첫날 밤',8,12],['DAY 2','아침 식사','둘째 날의 아침',13,8],['DAY 2','이소 해변','바다 건너 화산을 바라봐',22,20],['DAY 2','사쿠라지마 페리','푸른 바다 위를 건너는 시간',30,5],['DAY 2','사쿠라지마 전망대','여행의 가장 멋진 풍경',45,18],['DAY 2','가고시마 공항','우리의 1박 2일, 다음 여행에서 만나',-36,-12]];
const scene=new THREE.Scene();scene.background=new THREE.Color('#a8d6ed');scene.fog=new THREE.Fog('#a8d6ed',80,180);const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#scene'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;scene.add(new THREE.HemisphereLight(0xffffff,0x658d87,2.3));const sun=new THREE.DirectionalLight(0xffefc7,2.5);sun.position.set(-35,60,20);scene.add(sun);
const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.85});const grass=mat('#8cbf8d'),sea=mat('#67b8cb'),road=mat('#e3d4b6'),wood=mat('#b77d56');function mesh(geo,m,x,y,z){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);scene.add(o);return o;}mesh(new THREE.PlaneGeometry(190,130),grass,0,-.08,0).rotation.x=-Math.PI/2;mesh(new THREE.PlaneGeometry(190,38),sea,0,-.045,-30).rotation.x=-Math.PI/2;
function box(x,z,w,h,d,color){mesh(new THREE.BoxGeometry(w,h,d),mat(color),x,h/2,z);}const rnd=(i)=>((Math.sin(i*127.1)*43758.5453)%1+1)%1;for(let i=0;i<170;i++){let x=-48+rnd(i)*100,z=-12+rnd(i+203)*42;if(stops.some(s=>Math.hypot(x-s[3],z-s[4])<5))continue;let h=1+rnd(i+77)*5;box(x,z,1.4+rnd(i+99)*1.8,h,1.5,['#e9dfd3','#d5bca8','#f5f1e5','#b8cdd1'][i%4]);}for(let i=0;i<65;i++){let x=-50+rnd(i+500)*104,z=-18+rnd(i+700)*45;const trunk=mesh(new THREE.CylinderGeometry(.15,.2,1.3,6),wood,x,.65,z);const crown=mesh(new THREE.ConeGeometry(.9,2.3,7),mat('#438c69'),x,2.2,z);}
const mountain=mesh(new THREE.ConeGeometry(14,19,48),mat('#698d75'),48,9,-18);mesh(new THREE.ConeGeometry(4.1,3,48),mat('#d7d5c8'),48,19,-18);const routePoints=stops.map(s=>new THREE.Vector3(s[3],.18,s[4]));for(let i=0;i<routePoints.length-1;i++){const a=routePoints[i],b=routePoints[i+1];const vec=b.clone().sub(a);const line=mesh(new THREE.BoxGeometry(.45,.07,vec.length()),road,(a.x+b.x)/2,.09,(a.z+b.z)/2);line.rotation.y=Math.atan2(vec.x,vec.z);}
function character(color,offset){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.43,.95,4,10),mat(color));body.position.y=1.1;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),mat('#f1c49e'));head.position.y=2.12;g.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.45,16,10),mat(offset<0?'#352f2c':'#60453d'));hair.scale.y=.45;hair.position.y=2.38;g.add(hair);for(let s of [-1,1]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.48,3,7),mat('#3c5267'));leg.position.set(s*.22,.35,0);g.add(leg);}scene.add(g);return g;}const one=character('#3b8ca2',-1),two=character('#e7a0a0',1);
const labels=[];function label(text,x,z){const c=document.createElement('canvas');c.width=512;c.height=100;const ctx=c.getContext('2d');ctx.fillStyle='#173e4bdc';ctx.roundRect(4,4,504,90,25);ctx.fill();ctx.fillStyle='white';ctx.font='bold 31px sans-serif';ctx.textAlign='center';ctx.fillText(text,256,60);const t=new THREE.CanvasTexture(c);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));sp.position.set(x,4,z);sp.scale.set(8,1.6,1);scene.add(sp);labels.push(sp);}stops.slice(0,-1).forEach(s=>label(s[1],s[3],s[4]));
let state={playing:false,progress:0,speed:1,updatedAt:Date.now()},view=0,angle=.8,zoom=18,lastStop=-1;
const params=new URLSearchParams(location.search);const room=params.get('room')||Math.random().toString(36).slice(2,10);if(!params.get('room'))history.replaceState({},'',`?room=${room}`);
const roomId='kagoshima-trip-'+room;let host=false,conn=null,peer=null,connected=false;
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2600);}
function status(t){document.querySelector('#status').textContent=t;}
function send(msg){if(conn?.open)conn.send(msg);}
function receive(msg){if(!msg||typeof msg!=='object')return;if(msg.type==='state'&&msg.state){state=msg.state;status('2명 함께 여행 중');}if(msg.type==='control'&&host)applyControl(msg.action,msg);}
function wire(c){conn=c;c.on('open',()=>{connected=true;status('2명 접속');document.querySelector('#people').textContent='👫 두 사람 연결 완료';if(host)send({type:'state',state});});c.on('data',receive);c.on('close',()=>{connected=false;conn=null;status(host?'초대 대기 중':'연결 끊김');document.querySelector('#people').textContent='👫 상대방 연결 대기';});c.on('error',()=>status('연결 오류'));}
function startPeer(){if(typeof Peer==='undefined'){status('연결 서비스 로딩 실패');return;}peer=new Peer(roomId);peer.on('open',()=>{host=true;status('초대 대기 중');});peer.on('connection',c=>{if(conn?.open){c.on('open',()=>c.close());return;}wire(c);});peer.on('error',err=>{if(err.type==='unavailable-id'){peer.destroy();host=false;peer=new Peer();peer.on('open',()=>{status('상대방 연결 중');wire(peer.connect(roomId,{reliable:true}));});peer.on('error',()=>status('연결 실패 · 새로고침'));}else status('연결 실패 · 새로고침');});}
startPeer();setInterval(()=>{if(host&&connected)send({type:'state',state});},900);
function progress(){return Math.min(1,state.progress+(state.playing?(Date.now()-state.updatedAt)/420000*state.speed:0));}
function applyControl(action,extra={}){const p=progress();state={...state,progress:p,updatedAt:Date.now()};if(action==='play')state.playing=true;if(action==='pause')state.playing=false;if(action==='restart'){state.playing=false;state.progress=0;}if(action==='speed')state.speed=extra.speed;if(action==='seek')state.progress=Math.max(0,Math.min(1,extra.progress));if(host)send({type:'state',state});}
function control(action,extra={}){if(!host&&connected){send({type:'control',action,...extra});return;}applyControl(action,extra);}
document.querySelector('#play').onclick=()=>control(state.playing?'pause':'play');document.querySelector('#restart').onclick=()=>control('restart');document.querySelector('#speed').onclick=()=>{let s=[.5,1,2,4],i=s.indexOf(state.speed);control('speed',{speed:s[(i+1)%s.length]});};document.querySelector('#camera').onclick=()=>{view=(view+1)%3;toast(['따라가기 시점','하늘에서 보기','풍경 시점'][view]);};document.querySelector('#invite').onclick=async()=>{const link=location.href;try{await navigator.clipboard.writeText(link);toast('초대 링크 복사 완료!');}catch{prompt('이 링크를 공유해 주세요',link);}};
let touching=false,startX=0,startY=0,pinch=0;renderer.domElement.addEventListener('pointerdown',e=>{touching=true;startX=e.clientX;startY=e.clientY;});renderer.domElement.addEventListener('pointermove',e=>{if(touching){angle+=(e.clientX-startX)*.006;zoom=Math.max(9,Math.min(45,zoom+(e.clientY-startY)*.035));startX=e.clientX;startY=e.clientY;}});window.addEventListener('pointerup',()=>touching=false);renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(8,Math.min(55,zoom+e.deltaY*.02));},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)zoom=Math.max(8,Math.min(55,zoom+(pinch-d)*.03));pinch=d;}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0);
const stopContainer=document.querySelector('#stops');stops.slice(0,-1).forEach((s,i)=>{let el=document.createElement('span');el.className='stop';el.textContent=s[1];el.onclick=()=>control('seek',{progress:i/(stops.length-1)});stopContainer.append(el);});function render(t){requestAnimationFrame(render);let p=progress();if(p>=1&&state.playing){state={...state,playing:false,progress:1,updatedAt:Date.now()};if(host)send({type:'state',state});}const segments=stops.length-1,f=Math.min(segments-.00001,p*segments),i=Math.floor(f),a=f-i,s=stops[i],n=stops[i+1];const x=s[3]+(n[3]-s[3])*a,z=s[4]+(n[4]-s[4])*a,heading=Math.atan2(n[3]-s[3],n[4]-s[4]);one.position.set(x-.62,0,z);two.position.set(x+.62,0,z);one.rotation.y=heading;two.rotation.y=heading;const bob=state.playing?Math.sin(t*.009*state.speed)*.06:0;one.position.y=bob;two.position.y=-bob;const focus=new THREE.Vector3(x,1,z);let desired;if(view===1)desired=new THREE.Vector3(x,zoom*1.8,z+1);else if(view===2)desired=new THREE.Vector3(x+zoom*.8,zoom*.5,z+zoom*.8);else desired=new THREE.Vector3(x+Math.sin(angle)*zoom,zoom*.65,z+Math.cos(angle)*zoom);camera.position.lerp(desired,.035);camera.lookAt(focus);if(lastStop!==i){lastStop=i;document.querySelector('#day').textContent=s[0];document.querySelector('#place').textContent=s[1];document.querySelector('#desc').textContent=s[2];[...stopContainer.children].forEach((el,j)=>el.classList.toggle('active',j===i));stopContainer.children[i]?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});}document.querySelector('#bar').style.width=(p*100)+'%';document.querySelector('#play').textContent=state.playing?'⏸ 일시정지':'▶ 출발';document.querySelector('#speed').textContent=state.speed+'× 속도';renderer.render(scene,camera);}requestAnimationFrame(render);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
