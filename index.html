</style></head><body><div id="loading">3D 월드를 불러오는 중…</div><div id="hud"><div class="panel"><h1>🌋 KAGOSHIMA WORLD</h1><small id="place">가고시마 · 자유 탐험</small></div><div class="panel" id="stats"><div id="clock">일본 시간 --:--</div><div id="weather">날씨 확인 중</div><div id="mode">🚶 도보</div></div></div><div id="map"><canvas id="minimap" width="250" height="250"></canvas></div><div id="travel" class="panel">가고시마 시내와 사쿠라지마를 탐험해 봐.</div><div id="toast"></div><div id="hint">왼쪽 조이스틱: 이동 · 화면 드래그: 시점</div><div id="bottom"><div id="joy"><div id="knob"></div></div><div class="actions"><button id="bus">🚌 버스 탑승</button><button id="ferry">⛴️ 페리 탑승</button><button id="walk">🚶 하차</button><button id="camera">📷 시점</button><button id="reset">↺ 시작점</button></div></div><div id="overlay"><div id="intro"><h2>우리 둘의 가고시마</h2><p>인천에서 출발해 가고시마의 거리와 바다를 탐험해 봐.<br>버스는 도심을 달리고, 페리는 사쿠라지마까지 항해해.<br><br><b>자유 이동형 3D 게임 프로토타입</b><br>실제 위치 관계를 참고한 축약 월드이며 실측 지형·건물 모델은 아니야.</p><button class="primary" id="start">✈️ 여행 시작</button></div></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const loading=document.getElementById('loading');let renderer,scene,camera,clock,avatar,bus,ferry,water,volcano,worldGroup;let running=false,mode='walk',cameraMode=0,heading=0,lookX=0,lookY=0,joyX=0,joyY=0,travelT=0,trip='';let pos=new THREE.Vector3(-140,2,80);const cityDock=new THREE.Vector3(76,1,8),islandDock=new THREE.Vector3(155,1,-22);const pathBus=[[-140,80],[-100,80],[-100,35],[-50,35],[-50,-5],[5,-5],[45,8],[76,8]];const pathFerry=[[76,8],[92,3],[110,-7],[135,-19],[155,-22]];const $=id=>document.getElementById(id);let toastTimer;function notify(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3600)}
function mat(c,rough=1){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}const groundMat=mat(0x7b9a72),roadMat=mat(0x424e56),roofMat=mat(0x49565b);function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function sphere(r,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.SphereGeometry(r,12,9),m);o.position.set(x,y,z);parent.add(o);return o}function line(points,color,width=1){const pts=points.map(p=>new THREE.Vector3(p[0],p[1],p[2]));const g=new THREE.BufferGeometry().setFromPoints(pts);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color,linewidth:width}));scene.add(l)}
function setup(){scene=new THREE.Scene();scene.background=new THREE.Color(0x91b9c7);scene.fog=new THREE.FogExp2(0x91b9c7,.0015);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,2000);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd9efff,0x637255,2.1));const sun=new THREE.DirectionalLight(0xffe3ae,2.6);sun.position.set(-140,210,-90);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-320;sun.shadow.camera.right=320;sun.shadow.camera.top=320;sun.shadow.camera.bottom=-320;scene.add(sun);const sea=new THREE.Mesh(new THREE.PlaneGeometry(1300,1300,30,30),new THREE.MeshPhysicalMaterial({color:0x277d99,metalness:.18,roughness:.27,transparent:true,opacity:.94}));sea.rotation.x=-Math.PI/2;sea.position.y=-.5;scene.add(sea);water=sea;const coast=new THREE.Mesh(new THREE.PlaneGeometry(410,500),groundMat);coast.rotation.x=-Math.PI/2;coast.position.set(-140,0,0);coast.receiveShadow=true;scene.add(coast);const island=new THREE.Mesh(new THREE.PlaneGeometry(320,370),mat(0x5e865d));island.rotation.x=-Math.PI/2;island.position.set(305,.1,-15);island.receiveShadow=true;scene.add(island);
// Terrain relief: a sculpted volcanic mountain and smaller ridges. Stylized approximation, not DEM.
const geo=new THREE.PlaneGeometry(245,245,80,80);geo.rotateX(-Math.PI/2);const a=geo.attributes.position;for(let i=0;i<a.count;i++){let x=a.getX(i),z=a.getZ(i);const r=Math.sqrt(x*x+z*z);let y= Math.max(0,105*Math.pow(Math.max(0,1-r/120),1.7)+13*Math.sin(x*.055)*Math.cos(z*.065)*(1-r/135));if(r<12)y-=7*(1-r/12);a.setY(i,y)}geo.computeVertexNormals();volcano=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x617b58,roughness:1,flatShading:true,side:THREE.DoubleSide}));volcano.position.set(300,.1,-30);volcano.castShadow=true;volcano.receiveShadow=true;scene.add(volcano);sphere(10,mat(0xb0a9a1),300,96,-30);for(let i=0;i<6;i++){const cloud=sphere(8+i*2,new THREE.MeshStandardMaterial({color:0xdde1de,transparent:true,opacity:.25}),297+i*3,119+i*9,-30-i*2);cloud.scale.set(1.7,.55,1)}
// Streets and city blocks
for(let x=-320;x<=40;x+=45){box(7,.11,490,roadMat,x,.14,0);for(let z=-235;z<235;z+=17)box(.3,.02,7,mat(0xe7d6a8),x,.22,z)}for(let z=-225;z<=225;z+=45){box(390,.12,7,roadMat,-135,.16,z);for(let x=-315;x<45;x+=18)box(7,.02,.3,mat(0xe7d6a8),x,.24,z)}let seed=4;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const palette=[0xd7d1c5,0x9caaa9,0xe4c5aa,0xaebac0,0xc3c8b4,0x7f9a9c];for(let x=-300;x<35;x+=45)for(let z=-210;z<220;z+=45){if(rnd()<.12)continue;const n=2+Math.floor(rnd()*3);for(let k=0;k<n;k++){let bx=x+8+rnd()*20,bz=z+7+rnd()*20;let h=6+rnd()*23;if(x>-100&&x<0&&z>-80&&z<80)h+=rnd()*28;const building=box(9+rnd()*7,h,9+rnd()*9,mat(palette[Math.floor(rnd()*palette.length)]),bx,h/2+.3,bz);box(building.geometry.parameters.width+.8,.6,building.geometry.parameters.depth+.8,roofMat,bx,h+.3,bz);for(let yy=3;yy<h-1;yy+=3.6)for(let zz=-1;zz<=1;zz+=2){box(.08,1.2,1.4,mat(0x496b78),bx+building.geometry.parameters.width/2+.05,yy,bz+zz*2.5)}}}
// Trees and shoreline
for(let i=0;i<190;i++){const x=-328+rnd()*380,z=-235+rnd()*470;if(rnd()<.35)continue;box(.55,3,.55,mat(0x6e5641),x,1.6,z);sphere(2.4+rnd()*2,mat(0x3e7652),x,4.1,z)}for(let i=0;i<100;i++){let angle=rnd()*Math.PI*2,r=85+rnd()*75;let x=300+Math.cos(angle)*r,z=-30+Math.sin(angle)*r;box(.6,3,.6,mat(0x6a513a),x,1.5,z);sphere(2.6,mat(0x3e704c),x,4,z)}
// Docks, ship and bus
box(45,1.5,15,mat(0x9c9c8d),62,.8,8);box(32,1.5,16,mat(0x99998b),165,.8,-22);box(24,2.4,8,mat(0x353d43),-140,1.4,80);bus=new THREE.Group();scene.add(bus);box(12,4.2,5,mat(0xe8b947),0,3,0,bus);box(11,1.6,5.05,mat(0xe9f0f2),0,4.15,0,bus);for(let x of [-4,4])for(let z of [-2.7,2.7]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,.5,12),mat(0x1b2225));wheel.rotation.x=Math.PI/2;wheel.position.set(x,1.2,z);bus.add(wheel)}bus.position.set(-140,0,80);ferry=new THREE.Group();scene.add(ferry);box(23,3.1,10,mat(0xe7e6d9),0,1,0,ferry);box(15,4,8,mat(0xf4f0df),-1,4,0,ferry);box(13,1.4,8.1,mat(0x527c8b),-1,5,0,ferry);box(18,.8,11,mat(0x1e526d),0,.5,0,ferry);ferry.position.copy(cityDock);ferry.position.y=.6;
// Player and a companion
avatar=new THREE.Group();scene.add(avatar);box(1.3,2.1,.9,mat(0xddd2bb),0,2.4,0,avatar);sphere(.85,mat(0xf0c5a7),0,4.1,0,avatar);box(1.1,1.8,.85,mat(0x344f63),0,2.6,0,avatar);for(const x of [-.35,.35])box(.35,1.3,.45,mat(0x27333e),x,.8,0,avatar);avatar.position.copy(pos);const partner=new THREE.Group();avatar.add(partner);partner.position.set(2.1,0,1.1);box(1.1,2,.8,mat(0xb88982),0,2.4,0,partner);sphere(.8,mat(0xe9bd9d),0,4,0,partner);for(const x of [-.3,.3])box(.3,1.3,.4,mat(0x6b6a75),x,.8,0,partner);
const marks=[['렘 가고시마',-125,85],['시로야마 전망대',-205,-85],['가고시마 중앙역',-165,30],['텐몬칸',-95,55],['사쿠라지마 페리터미널',76,8],['사쿠라지마',215,-30]];for(const [name,x,z] of marks){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,10,8),mat(0xe9c577));pole.position.set(x,5,z);scene.add(pole);sphere(2.4,mat(0xffd47a),x,11,z)}
clock=new THREE.Clock();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loading.remove();animate();}
function along(path,t){let lengths=[],total=0;for(let i=1;i<path.length;i++){const l=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);lengths.push(l);total+=l}let d=Math.max(0,Math.min(1,t))*total;for(let i=0;i<lengths.length;i++){if(d<=lengths[i]){let q=d/lengths[i];return new THREE.Vector3(THREE.MathUtils.lerp(path[i][0],path[i+1][0],q),0,THREE.MathUtils.lerp(path[i][1],path[i+1][1],q))}d-=lengths[i]}return new THREE.Vector3(path.at(-1)[0],0,path.at(-1)[1])}
function beginBus(){if(mode!=='walk')return notify('먼저 하차해야 해.');if(pos.distanceTo(bus.position)>65){pos.set(-140,2,80);notify('버스 정류장으로 이동했어.')}mode='bus';trip='bus';travelT=0;$('mode').textContent='🚌 버스 이동';notify('🚌 공항 리무진 버스 탑승! 도심과 페리터미널로 이동해.');}
function beginFerry(){if(mode!=='walk')return notify('버스에서 먼저 하차해.');if(pos.distanceTo(cityDock)>75&&pos.distanceTo(islandDock)>75){pos.copy(cityDock);pos.y=2;notify('페리터미널로 이동했어.')}mode='ferry';trip=pos.x>115?'ferryBack':'ferry';travelT=0;$('mode').textContent='⛴️ 페리 항해';notify('⛴️ 사쿠라지마 페리 출항! 바다를 건너는 중.');}
function disembark(){if(mode==='walk')return notify('이미 도보 탐험 중이야.');if(mode==='bus'){pos.copy(bus.position);pos.y=2}else{pos.copy(ferry.position);pos.y=2}mode='walk';trip='';$('mode').textContent='🚶 도보';notify('하차했어. 이제 자유롭게 걸어 다닐 수 있어.');}
$('bus').onclick=beginBus;$('ferry').onclick=beginFerry;$('walk').onclick=disembark;$('camera').onclick=()=>{cameraMode=(cameraMode+1)%3;notify(['3인칭 카메라','멀리 보기','하늘에서 보기'][cameraMode])};$('reset').onclick=()=>{mode='walk';trip='';pos.set(-140,2,80);$('mode').textContent='🚶 도보';notify('출발 지점으로 돌아왔어.')};$('start').onclick=()=>{$('overlay').style.display='none';running=true;notify('✈️ 인천공항 출발 → 가고시마공항 도착! 여행 시작.');};
const joystick=$('joy'),knob=$('knob');function updateJoy(e){const r=joystick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(x,y)),scale=Math.min(1,45/len);joyX=x*scale/45;joyY=y*scale/45;knob.style.transform=`translate(${joyX*34}px,${joyY*34}px)`}joystick.addEventListener('pointerdown',e=>{joystick.setPointerCapture(e.pointerId);updateJoy(e)});joystick.addEventListener('pointermove',e=>{if(joystick.hasPointerCapture(e.pointerId))updateJoy(e)});function stopJoy(){joyX=joyY=0;knob.style.transform='translate(0,0)'}joystick.addEventListener('pointerup',stopJoy);joystick.addEventListener('pointercancel',stopJoy);let drag=null;window.addEventListener('pointerdown',e=>{if(e.target.tagName==='CANVAS'&&e.target.id!=='minimap')drag=[e.pointerId,e.clientX,e.clientY]});window.addEventListener('pointermove',e=>{if(drag&&drag[0]===e.pointerId){lookX+=(e.clientX-drag[1])*.006;lookY=THREE.MathUtils.clamp(lookY+(e.clientY-drag[2])*.004,-.5,.8);drag=[e.pointerId,e.clientX,e.clientY]}});window.addEventListener('pointerup',e=>{if(drag&&drag[0]===e.pointerId)drag=null});const keys={};window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.06);if(running){if(mode==='walk'){const x=joyX+(keys.d?1:0)-(keys.a?1:0),z=joyY+(keys.s?1:0)-(keys.w?1:0);if(Math.abs(x)+Math.abs(z)>.08){const speed=22*dt;pos.x+=(x*Math.cos(lookX)+z*Math.sin(lookX))*speed;pos.z+=(-x*Math.sin(lookX)+z*Math.cos(lookX))*speed;pos.x=THREE.MathUtils.clamp(pos.x,-340,440);pos.z=THREE.MathUtils.clamp(pos.z,-240,240);avatar.rotation.y=Math.atan2(x,-z)+lookX}pos.y=2;avatar.position.copy(pos);avatar.visible=true}else{travelT+=dt/(mode==='bus'?29:34);if(mode==='bus'){const v=along(pathBus,travelT);bus.position.copy(v);pos.set(v.x,4,v.z);bus.rotation.y=Math.atan2(pathBus.at(-1)[0]-pathBus[0][0],pathBus.at(-1)[1]-pathBus[0][1]);}else{const v=along(pathFerry,trip==='ferryBack'?1-travelT:travelT);ferry.position.set(v.x,.6+Math.sin(performance.now()*.002)*.16,v.z);pos.set(v.x,5,v.z);ferry.rotation.y=trip==='ferryBack'?Math.PI:0}avatar.visible=false;if(travelT>=1){disembark();notify(mode==='walk'?'목적지 도착! 자유롭게 탐험해 봐.':'도착')}}}
const dist=cameraMode===0?19:cameraMode===1?40:115;const height=cameraMode===2?95:cameraMode===1?28:11;const target=new THREE.Vector3(pos.x+Math.sin(lookX)*dist*.7,height+pos.y+lookY*dist,pos.z+Math.cos(lookX)*dist*.7);camera.position.lerp(target,.09);camera.lookAt(pos.x,pos.y+3,pos.z);water.material.color.setHex(0x277d99);updateMini();renderer.render(scene,camera)}
function updateMini(){const c=$('minimap'),ctx=c.getContext('2d');ctx.clearRect(0,0,250,250);ctx.fillStyle='#2b7890';ctx.fillRect(0,0,250,250);ctx.fillStyle='#65895f';ctx.fillRect(0,0,142,250);ctx.beginPath();ctx.ellipse(215,115,35,65,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e5c66e';const px=(pos.x+340)/780*250,pz=(pos.z+240)/480*250;ctx.beginPath();ctx.arc(px,pz,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='white';ctx.font='12px sans-serif';ctx.fillText('가고시마',10,18);ctx.fillText('사쿠라지마',175,190)}
function time(){const t=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());$('clock').textContent='🇯🇵 일본 '+t}time();setInterval(time,30000);fetch('https://api.open-meteo.com/v1/forecast?latitude=31.5966&longitude=130.5571&current=temperature_2m,precipitation,weather_code&timezone=Asia%2FTokyo').then(r=>r.json()).then(d=>{$('weather').textContent=`🌡️ ${d.current.temperature_2m}°C · 강수 ${d.current.precipitation}mm`}).catch(()=>$('weather').textContent='날씨 정보 연결 실패');try{setup()}catch(e){loading.textContent='3D 엔진을 불러오지 못했어. 인터넷 연결을 확인해 줘.';console.error(e)}
