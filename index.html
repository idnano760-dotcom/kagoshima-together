let peer=null,conn=null,host=false,roomId='',lastSent=0;function updateNet(s){$('#net').textContent=s}function sendState(){if(conn?.open){try{conn.send({type:'state',p:[me.root.position.x,me.root.position.y,me.root.position.z],r:me.root.rotation.y,c:cfg,mode})}catch(e){console.warn(e)}}}function connectHandlers(c){conn=c;c.on('open',()=>{updateNet('🟢 2명 연결');toast('상대와 연결됐어!');sendState()});c.on('data',d=>{if(d?.type==='state'&&Array.isArray(d.p)){if(!friend){friend=avatar();scene.add(friend.root)}friend.root.position.set(...d.p);friend.root.rotation.y=d.r||0;if(d.c)dress(friend,d.c)} });c.on('close',()=>{updateNet('상대 연결 종료');if(friend){scene.remove(friend.root);friend=null}conn=null});c.on('error',e=>toast('연결 오류: '+e.type))}function startPeer(id,isHost){if(!window.Peer){toast('네트워크 라이브러리 로딩 실패');return}if(peer)peer.destroy();host=isHost;roomId=id;peer=new window.Peer(isHost?'kago-two-'+id:undefined,{debug:0});peer.on('open',()=>{if(isHost){updateNet('초대 대기 중');toast('방 생성 완료. 링크를 공유해')}else{const c=peer.connect('kago-two-'+id,{reliable:true});connectHandlers(c)}});peer.on('connection',c=>{if(conn?.open){c.close();return}connectHandlers(c)});peer.on('error',e=>{updateNet('연결 오류');toast('연결 실패: '+e.type)});peer.on('disconnected',()=>updateNet('연결 끊김'))}const query=new URLSearchParams(location.search);if(query.has('room')){setTimeout(()=>{startPeer(query.get('room'),false);toast('초대받은 방에 연결 중…')},1500)}$('#multiBtn').onclick=()=>openPanel('🔗 2인 실시간 멀티플레이',`<p>한 명은 방을 만들고 초대 링크를 보내. 상대는 링크를 열면 같은 월드에 접속해 각자 움직일 수 있어. <b>두 휴대폰 모두 인터넷 연결이 필요해.</b></p><label>방 코드 (영문/숫자)</label><input id="room" placeholder="예: trip2026" value="${roomId||''}"><p id="roomNote">GitHub Pages에서도 작동하도록 외부 무료 P2P 연결 서비스를 사용해. 공용 서비스 장애나 모바일 통신망에 따라 연결되지 않을 수 있어.</p><button id="makeRoom" style="margin-top:6px">방 만들기</button> <button id="joinRoom">방 참가</button> <button id="copyRoom">초대 링크 복사</button>`,()=>{$('#panelShade').style.display='none'});$('#panelBody').addEventListener('click',e=>{if(!['makeRoom','joinRoom','copyRoom'].includes(e.target.id))return;let id=($('#room')?.value||'').trim().replace(/[^a-zA-Z0-9_-]/g,'').slice(0,28);if(!id)id=Math.random().toString(36).slice(2,9);$('#room').value=id;if(e.target.id==='copyRoom'){const url=location.origin+location.pathname+'?room='+encodeURIComponent(id);navigator.clipboard?.writeText(url).then(()=>toast('초대 링크 복사 완료')).catch(()=>prompt('링크를 복사해',url));return}startPeer(id,e.target.id==='makeRoom');$('#panelShade').style.display='none'});
// Original procedural ambient music. Audio only starts on a user gesture.
let audio=null,musicOn=false,musicTimer=null;const melody=[0,4,7,11,7,4,2,5,9,12,9,5,0,4,7,12];function note(freq,when,dur=.45,volume=.022){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(volume,when+.04);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g).connect(audio.destination);o.start(when);o.stop(when+dur+.02)}let beat=0;function musicTick(){if(!musicOn||!audio)return;const t=audio.currentTime+.06;const semi=melody[beat%melody.length];note(220*Math.pow(2,semi/12),t,.7,.026);if(beat%4===0)note(110*Math.pow(2,[0,5,7,4][Math.floor(beat/4)%4]/12),t,1.5,.016);beat++}$('#musicBtn').onclick=()=>{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();musicOn=!musicOn;$('#musicBtn').textContent=musicOn?'♫ 음악 끄기':'♫ 음악 켜기';if(musicOn){musicTick();musicTimer=setInterval(musicTick,430)}else clearInterval(musicTimer)};
// movement, vehicle animation, third-person camera and minmap
const map=$('#map'),ctx=map.getContext('2d');let mapTick=0;function drawMap(){ctx.clearRect(0,0,208,208);ctx.fillStyle='#608e70';ctx.fillRect(0,0,208,208);ctx.fillStyle='#3989a2';ctx.fillRect(125,0,83,208);ctx.fillStyle='#79a178';ctx.beginPath();ctx.ellipse(187,100,21,54,0,0,TAU);ctx.fill();ctx.strokeStyle='#4b5555';ctx.lineWidth=5;for(let x of [35,70,102]){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,208);ctx.stroke()}for(let y of [38,80,120,163]){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(125,y);ctx.stroke()}function dot(p,col){const x=clamp((p.x+270)/600*208,3,205),y=clamp((p.z+230)/460*208,3,205);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,5,0,TAU);ctx.fill()}dot(me.root.position,'#ffdd8b');if(friend)dot(friend.root.position,'#fa92a8')}
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;busT+=dt*.115;ferryT+=dt*.11;const bp=routeAt(busRoute,busT),fp=routeAt(ferryRoute,ferryT);b.position.set(bp.x,0,bp.z);b.rotation.y=bp.angle;f.position.set(fp.x,0,fp.z);f.rotation.y=fp.angle;f.position.y=Math.sin(time*1.6)*.12;smoke.forEach((s,i)=>{s.position.x=284+i*3+Math.sin(time*.3+i)*3;s.position.y=111+i*11+Math.sin(time*.6+i)*2});
if(mode==='walk'){const x=vel.x+(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),y=vel.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const mag=Math.hypot(x,y);if(mag>.08){const speed=(run?17:9)*dt;const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const mx=(-y*forward.x+x*right.x)/Math.max(1,mag),mz=(-y*forward.z+x*right.z)/Math.max(1,mag);me.root.position.x=clamp(me.root.position.x+mx*speed,-300,355);me.root.position.z=clamp(me.root.position.z+mz*speed,-230,230);me.root.rotation.y=Math.atan2(mx,mz);walking+=dt*12;me.legL.rotation.x=Math.sin(walking)*.5;me.legR.rotation.x=-Math.sin(walking)*.5;me.armL.rotation.x=-Math.sin(walking)*.3;me.armR.rotation.x=Math.sin(walking)*.3}else{me.legL.rotation.x*=.7;me.legR.rotation.x*=.7;me.armL.rotation.x*=.7;me.armR.rotation.x*=.7}if(vy||jump){vy-=20*dt;jump=Math.max(0,jump+vy*dt);if(jump===0)vy=0}me.root.position.y=jump}else{const v=mode==='bus'?b:f;const offset=new THREE.Vector3(mode==='bus'?-1:0,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),v.rotation.y);me.root.position.set(v.position.x+offset.x,mode==='bus'?1.1:2.5,v.position.z+offset.z);me.root.rotation.y=v.rotation.y;me.legL.rotation.x=me.legR.rotation.x=0}
const p=me.root.position,dist=zoom;const goal=new THREE.Vector3(p.x-Math.sin(yaw)*Math.cos(pitch)*dist,p.y+5+Math.sin(pitch)*dist,p.z-Math.cos(yaw)*Math.cos(pitch)*dist);camera.position.lerp(goal,Math.min(1,dt*7));camera.lookAt(p.x,p.y+3,p.z);const interaction=$('#interact');if(mode!=='walk'){interaction.style.display='block';interaction.textContent='🚶 하차'}else{const n=near();interaction.style.display=n?'block':'none';if(n)interaction.textContent=n.kind==='bus'?'🚌 버스 탑승':'⛴️ 페리 탑승'}if(now-lastSent>95){sendState();lastSent=now}if(++mapTick%10===0)drawMap();renderer.render(scene,camera)}
function clock(){const t=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());$('#clock').textContent=t}clock();setInterval(clock,30000);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('#loading').style.display='none';toast('텐몬칸에 도착했어! 캐릭터를 움직여 봐');requestAnimationFrame(animate);
</script></body></html>
